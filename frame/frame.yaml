# esphome-frame — frame.yaml
# ===========================
# ESPHome config for Seeed EE04 (XIAO ESP32-S3 Plus) + 7.3" Spectra6 display.
#
# Copy this file for each frame and change the substitutions block only.
# Secrets (wifi, API key, OTA password) live in secrets.yaml — see example.
#
# First flash: must be done over USB (see README).
# All subsequent updates: OTA via Wi-Fi.

substitutions:
  # Unique name for this device (lowercase, hyphens ok, no spaces)
  device_name: "eink-frame-1"

  # Index passed to the server: /frame/0/current.png, /frame/1/current.png …
  # Frame 0 shows the newest image; frame 1 shows the next in the pool, etc.
  frame_index: "0"

  # Server URL to fetch images from. The device will GET /frame/${frame_index}/current.png
  server_url: "http://158.178.244.140:5001"

  # How often to check for a new image tag. The display only refreshes if the tag changed.
  # Spectra6 takes ~30s to refresh so there's no point checking more often than that.
  # Format: Xs, Xmin, Xh  (e.g. "1min", "5min", "1h")
  update_interval: "1min"


esphome:
  name: ${device_name}
  friendly_name: ${device_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

# ── Stores the last seen image tag so we can skip unchanged images ─────────────
globals:
  - id: last_image_tag
    type: std::string
    restore_value: false
    initial_value: '""'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # ESP32-S3's Wi-Fi is 2.4GHz only
  ap:
    ssid: "${device_name} fallback"
    password: !secret ap_password
  on_connect:
    - script.execute: check_and_refresh

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# pull in the epaper_spi component from ESPHome's main repo
external_components:
  - source:
      type: git
      url: https://github.com/esphome/esphome/
      ref: 2025.10.5
    components: [epaper_spi, display]

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

http_request:

# online_image downloads the PNG into PSRAM and triggers a display update
# image needs to be pre-dithered to the Spectra6's 6-colour palette
online_image:
  - id: frame_image
    url: "${server_url}/frame/${frame_index}/current.png"
    format: PNG
    type: RGB
    on_download_finished:
      - component.update: eink_display
    on_error:
      - logger.log:
          level: WARN
          format: "Image download failed — retrying in 30s"
      - delay: 30s
      - script.execute: check_and_refresh

# ── Tag check script ──────────────────────────────────────────────────────────
# Fetches a lightweight tag from the server. Only downloads and refreshes the
# display if the tag has changed since the last check.

script:
  - id: check_and_refresh
    then:
      - http_request.get:
          url: "${server_url}/frame/${frame_index}/tag"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (body != id(last_image_tag)) {
                    ESP_LOGI("frame", "Image tag changed: %s -> %s", id(last_image_tag).c_str(), body.c_str());
                    id(last_image_tag) = body;
                    id(frame_image).release();
                    id(frame_image).update();
                  } else {
                    ESP_LOGI("frame", "Image unchanged, skipping refresh");
                  }

# ── Boot button — manual image advance ───────────────────────────────────────
# Press the BOOT button on the XIAO ESP32-S3 to skip to the next image.
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Next Image"
    on_press:
      - http_request.post:
          url: "${server_url}/next"
      - lambda: 'id(last_image_tag) = "";'  # force refresh after manual advance
      - script.execute: check_and_refresh

# configurable update interval — only poll when wifi is connected
interval:
  - interval: ${update_interval}
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: check_and_refresh

display:
  - platform: epaper_spi
    id: eink_display
    model: 7.3in-Spectra-E6
    cs_pin: GPIO44
    dc_pin:
      number: GPIO10
      inverted: false
    busy_pin:
      number: GPIO4
      inverted: true   # BUSY is active-low on the Spectra6
    reset_pin: GPIO38
    rotation: 0°
    # set to never — updates are triggered by the image download callback
    update_interval: never
    lambda: |-
      it.image(0, 0, id(frame_image));

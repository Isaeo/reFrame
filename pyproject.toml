[project]
name = "reframe"
version = "0.1.0"
description = "Self-hosted e-ink frame server — polls Google Drive and serves images to ESPHome displays"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "google-api-python-client>=2.196.0",
    "google-auth>=2.52.0",
    "gunicorn>=26.0.0",
    "numpy>=2.4.5",
    "pillow>=12.2.0",
    "pillow-heif>=1.3.0",
]

[dependency-groups]
dev = [
    "esphome>=2026.4.5",
]
